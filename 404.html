<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つからない｜情報理論入門</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Inconsolata:wght@400;600&display=swap">
<style>
:root {
  color-scheme: light dark;
  /* 和文はモリサワの UD ゴシック（BIZ UDGothic）。読みやすさのために設計された書体で、
     Google Fonts から配信されるので端末を問わず同じ字面になる。プロポーショナル版
     (BIZ UDPGothic) ではなく等幅かな版を採るのは、原稿の句読点が「，．」だからである
     (執筆原則 §9)。プロポーショナルだと，．が詰まって文の切れ目が見えなくなる。
     欧文と数字は和文書体に任せず、システムのサンセリフを先に置く。数式が AMS Euler
     なので、地の文の欧文をサンセリフにしておくと、どこからが数式かが字面で分かる。 */
  --latin: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial;
  --jp: "BIZ UDGothic", "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html { font-size: 18px; }
body {
  font-family: var(--latin), var(--jp);
  font-size: 1rem;
  line-height: 1.85; margin: 0; padding: 0;
  line-break: strict;
  /* text-wrap: pretty は使わない。Safari が和文の段落の全行を早めに折り、右に余白が残る。 */
  background: #fbfbfa; color: #1a1a1a;
}
.container { max-width: 760px; margin: 0 auto; padding: 2.2rem 1.1rem 6rem; }
h1 { font-size: 1.7rem; line-height: 1.4; border-bottom: 2px solid #ddd; padding-bottom: .5rem; }
h2 { font-size: 1.35rem; margin-top: 2.6rem; border-bottom: 1px solid #e3e3e3; padding-bottom: .3rem; }
h3 { font-size: 1.12rem; margin-top: 1.9rem; }
a { color: #0b67d0; }
blockquote { border-left: 3px solid #e3e3e3; margin: 1.1rem 0; padding: .15rem 0 .15rem 1rem; color: #8a8a8a; background: none; }
blockquote p { margin: .4rem 0; }
/* 宣言名 / ファイルパスの長い識別子が狭い画面で横にはみ出すため、行内 code は折り返す。
   コードブロック (pre code) は Lean コードの整形を保つので折り返さず横スクロールさせる。 */
code { font-family: Inconsolata, ui-monospace, "SF Mono", Menlo, monospace; font-size: .95em; background: rgba(0,0,0,.05); color: inherit; padding: .08em .3em; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: #f4f4f2; border-radius: 6px; margin: 1rem 0; }
pre code { display: block; padding: .8rem 1rem; overflow-x: auto; background: none; color: inherit; font-size: .92em; overflow-wrap: normal; }
hr { border: none; border-top: 1px solid #e0e0e0; margin: 2.4rem 0; }
table { border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid #ddd; padding: .4rem .7rem; }
/* 数式の横スクロールは displayOverflow: 'scroll' が持つ（build 側のコメント参照）。
   ここで足すのは余白だけにして、overflow には触らない。 */
mjx-container[display="true"] { margin: 1.1rem 0; }
mjx-container { font-size: 1.06em; }
/* 地の文と行内数式のあいだの四分アキ（build 側の math_gap 規則が付けるクラス）。 */
mjx-container.jp-l { margin-left: .25em; }
mjx-container.jp-r { margin-right: .25em; }
mjx-utext { font-feature-settings: normal; }
.kin { white-space: nowrap; }
.kin mjx-container { white-space: normal; }
.code-tail { overflow-wrap: normal; }
h1 .subtitle { display: block; font-size: 1rem; font-weight: normal; color: #888; }
.site-note { font-size: .82rem; color: #888; margin-top: 4rem; text-align: center; }
.site-note a { color: inherit; }

/* --- 定理環境 ---
   原稿 (.claude/rules/textbook-writing.md §5 の決まり文句) は Markdown のままで、
   ブロック化は build 側の decorateStatements() が行う。色は種別の区別だけを担い、
   背景は敷かない (紙の数学書に近い見え方を保つ)。 */
.stmt {
  --stmt-accent: #8a8a8a;
  margin: 1.9rem 0;
}
.stmt > :first-child { margin-top: 0; }
.stmt > :last-child { margin-bottom: 0; }
.stmt > p:first-child > strong:first-child { color: var(--stmt-accent); font-weight: 700; }
.stmt-theorem, .stmt-proposition, .stmt-corollary { --stmt-accent: #2f5fa8; }
.stmt-definition { --stmt-accent: #2c7a5a; }
.stmt-lemma { --stmt-accent: #8a8a8a; }
.stmt-example { --stmt-accent: #96702a; }

/* 「証明.」の見出し。太字を三層に割る (主張の見出しは色付き / 証明の開始はグレーの
   ラベル / 地の文の太字リードは素の太字)。同じ <strong> が三つの役割を兼ねると、
   どこまでが一つの塊なのかが読者に見えない。 */
.proof { margin: 1.5rem 0 2rem; color: #2f2f2f; }
.proof::after { content: ""; display: block; clear: both; }
.proof > :first-child { margin-top: 0; }
.proof > p:first-child > strong:first-child {
  font-weight: 600; letter-spacing: .05em; color: #7a7a7a;
}
.qed { float: right; color: #7a7a7a; }
.env-head { margin-bottom: .55rem; }
.qed-line { text-align: right; margin-top: -.6rem; }
.qed-line .qed { float: none; }

/* 形式化ポインタ。主張ブロック (縦罫) とは別の体裁にして取り違えを防ぐ。 */
.formalized {
  font-size: .93rem;
  margin: 1.4rem 0;
  padding: .55rem .95rem;
  background: rgba(42,122,134,.07);
  border-radius: 6px;
  color: #3a3a3a;
}
.formalized > :first-child { margin-top: 0; }
.formalized > :last-child { margin-bottom: 0; }
.formalized > p:first-child > strong:first-child { color: #22707c; font-weight: 700; }

/* 形式化上の注記はポインタの中の折りたたみにする（読み飛ばしてよいので既定で閉じる）。 */
.fnote { margin-top: .55rem; }
.formalized > .fnote:first-child { margin-top: 0; }
.fnote > summary { cursor: pointer; color: #4f7c83; font-size: .88rem; font-weight: 600; }
.fnote[open] > summary { margin-bottom: .5rem; }
.fnote > :not(summary) { color: #5a5a5a; }
.fnote > :last-child { margin-bottom: 0; }

/* 読み飛ばしてよい傍注 (記法の先取り)。折りたたみで組む。 */
.aside {
  font-size: .93rem;
  border-left: 3px solid #e3e3e3;
  margin: 1.4rem 0;
  padding: .1rem 0 .1rem 1rem;
  color: #8a8a8a;
}
.aside > :first-child { margin-top: 0; }
.aside > :last-child { margin-bottom: 0; }
.aside strong:first-child { color: #6f6f6f; }
.aside > summary { cursor: pointer; color: #6f6f6f; font-size: .88rem; font-weight: 600; }
.aside[open] > summary { margin-bottom: .5rem; }

/* --- 図（執筆原則 §12） ---
   図のソースは色を持たず、線と面のクラスだけを付ける。色はここでテーマごとに決める。 */
.fig {
  --fig-accent: #2f5fa8; --fig-muted: #a0a0a0;
  --fig-fill-a: rgba(47,95,168,.13); --fig-fill-b: rgba(150,112,42,.15);
  margin: 2rem 0;
}
.fig-art svg { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; overflow: visible; }
.fig-art text { font-family: var(--latin), var(--jp); fill: currentColor; }
.fig-art .f-axis { fill: none; stroke: currentColor; stroke-width: 1; }
.fig-art .f-guide { fill: none; stroke: var(--fig-muted); stroke-width: 1; stroke-dasharray: 3 3; }
.fig-art .f-leader { fill: none; stroke: var(--fig-muted); stroke-width: 1; }
.fig-art .f-curve { fill: none; stroke: var(--fig-accent); stroke-width: 2.2; stroke-linejoin: round; }
.fig-art .f-dot { fill: var(--fig-accent); }
.fig-art .f-region-a { fill: var(--fig-fill-a); stroke: var(--fig-accent); stroke-width: 1.4; }
.fig-art .f-region-b { fill: var(--fig-fill-b); stroke: #96702a; stroke-width: 1.4; }
.fig-art .f-curve-b { fill: none; stroke: #96702a; stroke-width: 2.2; stroke-linejoin: round; }
.fig-art .f-area { fill: var(--fig-fill-a); stroke: none; }
.fig-art .f-area-b { fill: var(--fig-fill-b); stroke: none; }
.fig-art .f-box { fill: none; stroke: currentColor; stroke-width: 1.2; }
.fig-art .f-node { fill: var(--fig-fill-a); stroke: var(--fig-accent); stroke-width: 1.4; }
.fig-art .f-node-b { fill: var(--fig-fill-b); stroke: #96702a; stroke-width: 1.4; }
.fig-art .f-hollow { fill: none; stroke: var(--fig-muted); stroke-width: 1.2; }
.fig-art .f-arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.fig-art .f-arrow-head { fill: currentColor; }
.fig-art .f-arrow-muted { fill: none; stroke: var(--fig-muted); stroke-width: 1.1; }
.fig-art .f-arrow-muted-head { fill: var(--fig-muted); }
.fig-art .f-edge { fill: none; stroke: var(--fig-muted); stroke-width: 1.2; }
.fig-art .f-edge-hot { fill: none; stroke: var(--fig-accent); stroke-width: 2.4; }
.fig-art .f-label { font-size: 12px; }
.fig-art .f-stem { fill: none; stroke: var(--fig-accent); stroke-width: 2.4; }
.fig-art .f-stem-b { fill: none; stroke: #96702a; stroke-width: 2.4; }
.fig figcaption { font-size: .9rem; color: #555; margin-top: .7rem; }
.fig figcaption > p { margin: 0; }
.fig figcaption > p:first-child > strong:first-child { color: #555; }

/* --- 相互参照リンク ---
   本文の「定理 1.2.3」「1.6 節」はビルドがリンクに変える。数式と地の文のあいだに置かれる
   ので、リンク色で塗ると本文が騒がしくなる。文字色は地の文のまま、下線の色だけで
   クリックできることを示し、ホバーでリンク色に寄せる。 */
a.xref { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(11,103,208,.42); }
a.xref:hover, a.xref:focus { color: #0b67d0; border-bottom-color: #0b67d0; }

/* 形式化ポインタの行内 code は掲載先へのリンクになる（宣言名は API ドキュメントの項目、
   パスは GitHub のソース）。相互参照と同じで、色ではなく下線でクリックできることを示す。 */
a.srcref { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(34,112,124,.45); }
a.srcref:hover, a.srcref:focus { color: #22707c; border-bottom-color: #22707c; }
a.srcref code { background: rgba(34,112,124,.09); }
.ptr-icon {
  width: .82em; height: .82em; margin-right: .26em; vertical-align: -.09em;
  fill: currentColor; opacity: .62;
}
a.srcref:hover .ptr-icon, a.srcref:focus .ptr-icon { opacity: 1; }

/* 飛んだ先が画面の最上端に貼り付くと、どこに着地したのか読み取れない。余白を空け、
   着地点に薄く色を敷いて示す（box-shadow の spread なので行送りは動かない）。 */
[id] { scroll-margin-top: 1.6rem; }
.stmt:target, .proof:target, .formalized:target, .aside:target, .fig:target,
h1:target, h2:target, h3:target {
  background: rgba(11,103,208,.075);
  box-shadow: 0 0 0 .5rem rgba(11,103,208,.075);
  border-radius: 2px;
}

/* --- multi-page navigation --- */
.nav-top {
  font-size: .85rem; color: #888;
  padding-bottom: 1rem; margin-bottom: 1.6rem; border-bottom: 1px solid #e3e3e3;
}
.nav-top a { text-decoration: none; }
.nav-bottom {
  display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  font-size: .9rem;
  padding-top: 1.3rem; margin-top: 3.5rem; border-top: 1px solid #e3e3e3;
}
.nav-bottom a { text-decoration: none; }
.nav-bottom .spacer { flex: 1; }
.toc { list-style: none; padding: 0; margin: 2rem 0 0; }
.toc li {
  margin: .85rem 0; padding: .95rem 1.15rem;
  border: 1px solid #e3e3e3; border-radius: 8px; background: #fff;
}
.toc a { font-weight: 600; font-size: 1.05rem; text-decoration: none; }
.subtoc { list-style: none; padding: 0; margin: .8rem 0 0; border-top: 1px solid #ececec; }
.subtoc li { margin: 0; padding: .3rem 0 0; border: none; border-radius: 0; }
.subtoc a { font-weight: 400; font-size: .92rem; }

.theme-toggle {
  position: absolute; top: .9rem; right: .9rem;
  display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0;
  border: none; border-radius: 6px; background: none; color: #888; cursor: pointer;
}
.theme-toggle:hover { color: #1a1a1a; background: rgba(0,0,0,.05); }
.theme-toggle svg { width: 1.1rem; height: 1.1rem; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

  body { background: #15171a; color: #e6e6e6; }
  a { color: #6cb6ff; }
  blockquote { border-left-color: #333a42; color: #9aa3ad; background: none; }
  code { background: rgba(255,255,255,.08); color: inherit; }
  pre { background: #1c1f24; }
  pre code { background: none; color: #d7dce2; }
  hr { border-color: #2a2e34; }
  th, td { border-color: #2a2e34; }
  .theme-toggle { color: #8a929b; }
  .theme-toggle:hover { color: #e6e6e6; background: rgba(255,255,255,.07); }
  .nav-top, .nav-bottom { border-color: #2a2e34; }
  .toc li { border-color: #2a2e34; background: #1a1d21; }
  .subtoc { border-top-color: #2a2e34; }
  .stmt-theorem, .stmt-proposition, .stmt-corollary { --stmt-accent: #7ba7e8; }
  .stmt-definition { --stmt-accent: #63b894; }
  .stmt-lemma { --stmt-accent: #9aa3ad; }
  .stmt-example { --stmt-accent: #c9a45e; }
  .proof { color: #c9cdd3; }
  .proof > p:first-child > strong:first-child { color: #98a1aa; }
  .qed { color: #98a1aa; }
  .formalized { background: rgba(122,200,212,.09); color: #c9cdd3; }
  .formalized > p:first-child > strong:first-child { color: #63b5c2; }
  .fnote > summary { color: #7fb3bb; }
  .fnote > :not(summary) { color: #aab1b9; }
  .aside { border-left-color: #333a42; color: #9aa3ad; }
  .aside strong:first-child { color: #aeb6bf; }
  a.xref { border-bottom-color: rgba(108,182,255,.45); }
  a.xref:hover, a.xref:focus { color: #6cb6ff; border-bottom-color: #6cb6ff; }
  a.srcref { border-bottom-color: rgba(99,181,194,.5); }
  a.srcref:hover, a.srcref:focus { color: #63b5c2; border-bottom-color: #63b5c2; }
  a.srcref code { background: rgba(99,181,194,.14); }
  .fig { --fig-accent: #7ba7e8; --fig-muted: #6b737c;
    --fig-fill-a: rgba(123,167,232,.16); --fig-fill-b: rgba(201,164,94,.16); }
  .fig-art .f-region-b, .fig-art .f-node-b { stroke: #c9a45e; }
  .fig-art .f-curve-b, .fig-art .f-stem-b { stroke: #c9a45e; }
  .fig figcaption, .fig figcaption > p:first-child > strong:first-child { color: #aab1b9; }
  .stmt:target, .proof:target, .formalized:target, .aside:target, .fig:target,
  h1:target, h2:target, h3:target {
    background: rgba(108,182,255,.1);
    box-shadow: 0 0 0 .5rem rgba(108,182,255,.1);
  }
  }
}

</style>
<script>
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<script>
(() => {
  if (new URLSearchParams(location.search).get('review') !== '1') return;
  window.hypothesisConfig = () => ({ showHighlights: 'always', openSidebar: false });
  const s = document.createElement('script');
  s.src = 'https://hypothes.is/embed.js';
  s.async = true;
  document.head.appendChild(s);
  document.addEventListener('DOMContentLoaded', () => {
    for (const a of document.querySelectorAll('a[href]')) {
      const u = new URL(a.href, location.href);
      if (u.origin !== location.origin) continue;
      u.searchParams.set('review', '1');
      a.href = u.href;
    }
  });
})();
</script>

<body>
<button type="button" class="theme-toggle" aria-label="ライトモードとダークモードを切り替える"></button>
<script>
(() => {
  const btn = document.currentScript.previousElementSibling;
  const root = document.documentElement;
  const icon = (body) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  const sun = icon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>');
  const moon = icon('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>');
  const dark = () => (root.dataset.theme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const paint = () => { btn.innerHTML = dark() ? sun : moon; };
  paint();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
  btn.addEventListener('click', () => {
    root.dataset.theme = dark() ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch {}
    paint();
  });
})();
</script>
