name: docs

# MEASUREMENT BRANCH — `purelean-ci-bench`. Do not merge this file into main.
#
# The question it answers: what does litedoc4 cost in CI, and how does that
# change if its Rust half is replaced by Lean. It is the release docs.yml with
# the publishing removed (no `environment`, no deploy-pages) so it can be
# dispatched from a branch, and with the litedoc4 revision as an input so the
# same job can be run against two implementations.
#
# `uses:` cannot take an expression, so litedoc4 is checked out at the requested
# ref and used as a local action.
on:
  workflow_dispatch:
    inputs:
      litedoc4-ref:
        description: "the litedoc4 revision to measure"
        default: "v1.2.0"
      cache:
        description: "let the action use actions/cache (false measures the cold path)"
        default: "true"

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1

      - name: check out litedoc4 at the ref under measurement
        uses: actions/checkout@v5
        with:
          repository: FujiHaruka/litedoc4
          ref: ${{ inputs.litedoc4-ref }}
          path: litedoc4

      - uses: ./litedoc4
        id: docs
        with:
          lib: InformationTheory
          lake-build: false
          cache: ${{ inputs.cache }}

      - name: what was produced
        run: |
          set -euo pipefail
          SITE="${{ steps.docs.outputs.site }}"
          echo "binary-source: ${{ steps.docs.outputs.binary-source }}"
          echo "pages:        $(find "$SITE" -name '*.html' | wc -l)"
          echo "bytes:        $(du -sb "$SITE" | cut -f1)"
          cat "${{ steps.docs.outputs.timings }}" || true
