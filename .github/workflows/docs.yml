name: docs

# MEASUREMENT BRANCH — `purelean-ci-bench`. Do not merge this file into main.
#
# The question it answers: what does litedoc4 cost in CI, and how does that
# change if its Rust half is replaced by Lean. It is the release docs.yml with
# the publishing removed (no `environment`, no deploy-pages) so it can be
# dispatched from a branch, and with the litedoc4 revision as an input so the
# same job can be run against two implementations.
#
# `uses:` cannot take an expression, so the revision under measurement is written
# into this file and this branch is pushed again. A local `uses: ./litedoc4` was
# tried first and is WRONG for this measurement (measured 2026-08-30, runs
# 33286269732 / 33286423780): the action's `actions/cache` paths then sit inside
# GITHUB_WORKSPACE and every save fails with `Invalid pattern`, so no run can
# ever hit the cache; and `github.action_ref` is empty, so no release asset
# applies and `cargo build` runs instead of the 2.9 s download. Both differences
# are invisible in the exit code.
on:
  workflow_dispatch:
    inputs:
      cache:
        description: "let the action use actions/cache (false measures the cold path)"
        default: "true"

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1

      # THE REVISION UNDER MEASUREMENT — edit this line and push the branch.
      - uses: FujiHaruka/litedoc4@v1.2.0
        id: docs
        with:
          lib: InformationTheory
          lake-build: false
          cache: ${{ inputs.cache }}

      - name: what was produced
        run: |
          set -euo pipefail
          SITE="${{ steps.docs.outputs.site }}"
          echo "binary-source: ${{ steps.docs.outputs.binary-source }}"
          echo "pages:        $(find "$SITE" -name '*.html' | wc -l)"
          echo "bytes:        $(du -sb "$SITE" | cut -f1)"
          cat "${{ steps.docs.outputs.timings }}" || true
