name: docs

# Publishes the API documentation (litedoc4) to GitHub Pages for a release.
#
# The trigger is the tag push, not `on: release`: release.yml creates the release with
# GITHUB_TOKEN, and events raised by that token do not start further workflows, so a
# `release` trigger would never fire for a tag pushed the usual way.
#
# Pages must be set to build from GitHub Actions (Settings -> Pages -> Source), not from a
# branch; the site is uploaded as an artifact and never committed to the repository.
#
# The `github-pages` environment also limits which refs may deploy, and GitHub seeds that
# list with branches only (main), so a tag push is rejected before the job starts (no logs,
# a few seconds). The environment carries a `tag: v*` deployment branch policy to allow it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One Pages deployment at a time. Queue instead of cancelling, so a release already in
# flight finishes publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every release is one version of the site, under `<tag>/`, so the textbook can link a
      # declaration at the same tag its source links name. Listing the tags needs them fetched.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: versions
        run: echo "list=$(git tag -l 'v*' --sort=version:refname | paste -sd, -)" >> "$GITHUB_OUTPUT"

      # Documents InformationTheory.* only; every Mathlib reference links to that pinned
      # revision's source. `lib` is required because the package is a lakefile.lean one. With
      # `versions`, litedoc4 checks each tag out, fetches its Mathlib cache and builds it
      # there, so the working tree is never built; the store of built versions is cached, and
      # a release run builds only the new tag.
      - uses: FujiHaruka/litedoc4@v2.0.0
        id: docs
        with:
          lib: InformationTheory
          lake-build: false
          versions: ${{ steps.versions.outputs.list }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docs.outputs.site }}

      - id: deployment
        uses: actions/deploy-pages@v4
